<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Viết Blog mới</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container narrow">
    <h1>Viết Blog mới</h1>

    <p class="empty-message" th:if="${categories.isEmpty()}">
        Bạn cần <a th:href="@{/categories/create}">tạo danh mục</a> trước khi viết bài.
    </p>

    <form class="editor-form" th:action="@{/blogs/create}" th:object="${blog}" method="post">
        <label for="title">Tiêu đề</label>
        <input id="title" type="text" th:field="*{title}" required>

        <label for="summary">Tóm tắt</label>
        <textarea id="summary" th:field="*{summary}" rows="3" required></textarea>

        <label for="content">Nội dung</label>
        <textarea id="content" th:field="*{content}" rows="12" required></textarea>

        <label for="categoryId">Danh mục</label>
        <select id="categoryId" name="categoryId" required>
            <option value="">-- Chọn danh mục --</option>
            <option th:each="category : ${categories}"
                    th:value="${category.id}"
                    th:text="${category.name}"></option>
        </select>

        <div class="actions">
            <button type="submit" th:disabled="${categories.isEmpty()}">Lưu</button>
            <a class="button secondary" th:href="@{/blogs}">Quay lại</a>
        </div>
    </form>
</div>
</body>
</html>
