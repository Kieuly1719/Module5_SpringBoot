<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết Blog</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<article class="container narrow">
    <h1 th:text="${blog.title}"></h1>

    <div class="metadata">
        <span>
            <strong>Danh mục:</strong>
            <a th:if="${blog.category != null}"
               th:href="@{/blogs(categoryId=${blog.category.id})}"
               th:text="${blog.category.name}"></a>
            <span th:unless="${blog.category != null}">Chưa phân loại</span>
        </span>
        <span>
            <strong>Ngày tạo:</strong>
            <span th:text="${#temporals.format(blog.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
        </span>
    </div>

    <p class="summary" th:text="${blog.summary}"></p>
    <div class="content" th:text="${blog.content}"></div>

    <div class="actions">
        <a class="button" th:href="@{/blogs/{id}/edit(id=${blog.id})}">Sửa</a>
        <a class="button secondary" th:href="@{/blogs}">Quay lại danh sách</a>
    </div>
</article>
</body>
</html>
