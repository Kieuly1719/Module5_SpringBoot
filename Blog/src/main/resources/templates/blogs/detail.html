<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết Blog</title>
</head>
<body>

<h1 th:text="${blog.title}"></h1>

<p>
    <strong>Tóm tắt:</strong>
    <span th:text="${blog.summary}"></span>
</p>

<p>
    <strong>Ngày tạo:</strong>
    <span th:text="${blog.createdAt}"></span>
</p>

<hr>

<div th:text="${blog.content}"></div>

<hr>

<a th:href="@{/blogs/{id}/edit(id=${blog.id})}">Sửa</a>
|
<a th:href="@{/blogs}">Quay lại danh sách</a>

</body>
</html>
