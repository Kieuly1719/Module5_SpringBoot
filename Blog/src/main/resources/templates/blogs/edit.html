<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật Blog</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container narrow">
    <h1>Cập nhật Blog</h1>

    <form class="editor-form" th:action="@{/blogs/{id}/edit(id=${blog.id})}" th:object="${blog}" method="post">
        <label for="title">Tiêu đề</label>
        <input id="title" type="text" th:field="*{title}" required>

        <label for="summary">Tóm tắt</label>
        <textarea id="summary" th:field="*{summary}" rows="3" required></textarea>

        <label for="content">Nội dung</label>
        <textarea id="content" th:field="*{content}" rows="12" required></textarea>

        <label for="categoryId">Danh mục</label>
        <select id="categoryId" name="categoryId" required>
            <option th:each="category : ${categories}"
                    th:value="${category.id}"
                    th:text="${category.name}"
                    th:selected="${blog.category != null && blog.category.id == category.id}"></option>
        </select>

        <div class="actions">
            <button type="submit">Cập nhật</button>
            <a class="button secondary" th:href="@{/blogs}">Quay lại</a>
        </div>
    </form>
</div>
</body>
</html>
