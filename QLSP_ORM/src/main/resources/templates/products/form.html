<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Form sản phẩm</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <h1 th:text="${pageTitle}">Form sản phẩm</h1>

    <form th:action="@{/products/save}" th:object="${product}" method="post" class="product-form">
        <input type="hidden" th:field="*{id}">

        <label>Tên sản phẩm</label>
        <input type="text" th:field="*{name}" required>

        <label>Giá sản phẩm</label>
        <input type="number" th:field="*{price}" min="0" step="1000" required>

        <label>Mô tả sản phẩm</label>
        <textarea th:field="*{description}" rows="4"></textarea>

        <label>Nhà sản xuất</label>
        <input type="text" th:field="*{manufacturer}" required>

        <div class="form-actions">
            <button type="submit">Lưu</button>
            <a th:href="@{/templates/products}">Quay lại</a>
        </div>
    </form>
</div>

</body>
</html>
