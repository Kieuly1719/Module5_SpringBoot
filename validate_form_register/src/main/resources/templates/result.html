<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký thành công</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="card result">
    <div class="success-icon">✓</div>
    <h1>Đăng ký thành công</h1>
    <p>Tài khoản của <strong th:text="${user.firstName + ' ' + user.lastName}"></strong> đã được lưu.</p>
    <dl>
        <dt>Số điện thoại</dt>
        <dd th:text="${user.phoneNumber}"></dd>
        <dt>Tuổi</dt>
        <dd th:text="${user.age}"></dd>
        <dt>Email</dt>
        <dd th:text="${user.email}"></dd>
    </dl>
    <a class="button-link" th:href="@{/}">Đăng ký người dùng khác</a>
</main>
</body>
</html>
